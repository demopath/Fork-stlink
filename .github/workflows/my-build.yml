name: my-build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -B build -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded .
          cmake --build build --config Release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: stlink-msvc
          path: build/dist
