name: my-build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: cmake 项目
        run: |
          ./gen_binaries_win.sh
      - name: 上传 stlink_build
        uses: actions/upload-artifact@v4
        with:
          name: stlink-msvc
          path: build/dist
            
